<!doctype html>
<html lang="ckb" dir="rtl" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Early runtime guard: hydrate saved locale and appearance theme prior to module evaluation
      try {
        window.locale = 'ckb';
        var savedLoc = localStorage.getItem('karejan_locale');
        if (savedLoc) window.locale = savedLoc;

        var validThemes = ['light', 'dark', 'forest', 'ocean', 'sunset', 'lavender'];
        var savedTheme = localStorage.getItem('karejan_theme') || localStorage.getItem('codenest-theme') || 'dark';
        if (validThemes.indexOf(savedTheme) === -1) savedTheme = 'dark';
        document.documentElement.dataset.theme = savedTheme;
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');
      } catch (e) {
        window.locale = 'ckb';
      }
    </script>
    <title>karejan — پلاتفۆرمی فێربوونی پرۆگرامینگ</title>
    <meta
      name="description"
      content="Learn HTML, CSS, JavaScript, Python, React, TypeScript, Vite & C++ in Sorani Kurdish, Badini Kurdish, Arabic, and English with interactive lessons, live Code Lab, and karejan AI."
    />
    <meta property="og:title" content="karejan — Multilingual Programming Learning Platform" />
    <meta
      property="og:description"
      content="Learn HTML, CSS, JavaScript, Python, React, TypeScript, Vite & C++ with interactive lessons, a sandboxed live Code Lab, daily challenges, AI tools, and karejan AI."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--kj-paper)] text-[var(--kj-ink)] antialiased selection:bg-[var(--kj-soft)] selection:text-[var(--kj-accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
