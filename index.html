    <script>
      // Early runtime guard: define global locale prior to any module evaluation
      try {
        window.locale = 'ckb';
        var savedLoc = localStorage.getItem('karejan_locale');
        if (savedLoc) window.locale = savedLoc;
      } catch (e) {
        window.locale = 'ckb';
      }
    </script>
